name: Apply OI Gold Pro V3 theme
on:
  push:
    paths:
      - 'v3-premium.css'
      - '.github/workflows/apply-v3-theme.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert theme link and update version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="v3-premium.css?v=30200">'
          s=s.replace('v3-premium.css?v=30100','v3-premium.css?v=30200')
          while s.count(tag) > 1:
              s=s.replace(tag+'\n'+tag,tag,1)
          s=s.replace('v3-premium.css?v=30100','v3-premium.css?v=30200')
          if tag not in s:
              assert '</head>' in s
              s=s.replace('</head>',tag+'\n</head>',1)
          s=s.replace("const APP_VER = '3.1.0'","const APP_VER = '3.2.0'")
          assert "const APP_VER = '3.2.0'" in s
          p.write_text(s)
          p=Path('CHANGELOG.md')
          s=p.read_text()
          entry='### V3.2.0 — 2026-10-29 — ChatGPT\n- ไฟล์: index.html, v3-premium.css\n- แก้อะไร: Chart Clarity: ชิปข่าวเลื่อนอ่านครบ ปุ่ม Timeframe กระชับ แถบล่างจัดใหม่; ไม่แก้ canvas OI\n- ระวัง: ปรับเฉพาะ UI ไม่เปลี่ยนตรรกะข้อมูลหรือ OI\n\n'
          if entry not in s:
              s=s.replace('## รายการ\n','## รายการ\n\n'+entry,1)
          p.write_text(s)
          PY
      - name: Commit only UI files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md
          git diff --cached --quiet || (git commit -m "V3.2.0 Apply chart clarity UI" && git push)
