name: Validate OI Gold Pro UI
on:
  push:
    paths:
      - 'index.html'
      - 'v33-luxury.css'
      - 'v33-luxury.js'
      - '.github/workflows/apply-v33-luxury.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and asset links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('v33-luxury.css').read_text(encoding='utf-8')
          js = Path('v33-luxury.js').read_text(encoding='utf-8')
          match = re.search(r"const APP_VER = '([0-9]+\.[0-9]+\.[0-9]+)'", html)
          assert match, 'APP_VER missing'
          version = match.group(1)
          for filename in ('v33-luxury.css', 'v33-luxury.js'):
              matches = re.findall(re.escape(filename) + r'\?v=([0-9]+)', html)
              assert len(matches) == 1, f'{filename}: expected one reference, got {matches}'
              assert Path(filename).is_file(), f'{filename} missing'
          assert 'v35header' in css and 'v35header' in js, 'V3.5 header missing'
          assert 'v34oiChart' in js, 'OI strike panel missing'
          assert 'v33nav' in js, 'Bottom navigation missing'
          assert version in Path('CHANGELOG.md').read_text(encoding='utf-8'), 'Version not in CHANGELOG'
          print(f'PASS: OI Gold Pro V{version}; linked assets and UI markers verified')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check v33-luxury.js
      - name: Check changes
        run: |
          git diff --check
