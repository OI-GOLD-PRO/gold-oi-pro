name: cme-probe
on:
  workflow_dispatch:
  push:
    paths: ['scripts/cme_probe.mjs', '.github/workflows/cme-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - run: xvfb-run -a node scripts/cme_probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe_out.json
