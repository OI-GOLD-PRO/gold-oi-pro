# Backtest 🛡 กรอบดีลเลอร์รับ (ยืน/ทะลุไปไกลไหม) — กด Run workflow เอง ผลอยู่ใน log
name: dbox-bt
on:
  workflow_dispatch:
  push:
    paths: ['scripts/dbox_bt.mjs']
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/dbox_bt.mjs
