# ดึงข่าวแดง (High impact) จาก Forex Factory ทุกชั่วโมง แล้วบันทึกเป็น news.json ให้หน้าแอปอ่าน
name: ff-news
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/news.yml']
permissions:
  contents: write
concurrency: ff-news
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Forex Factory calendar
        run: |
          set -e
          ok=0
          for wk in thisweek nextweek; do
            if curl -fsSL -A 'Mozilla/5.0 (oi-gold news bot)' "https://nfs.faireconomy.media/ff_calendar_${wk}.json" -o "/tmp/${wk}.json"; then ok=1; else echo '[]' > "/tmp/${wk}.json"; fi
          done
          [ "$ok" = 1 ] || { echo "fetch failed"; exit 0; }
          jq -s 'add | map(select(.impact == "High"))
                 | map({date, c: .country, title, forecast, previous})
                 | unique_by([.date, .c, .title]) | sort_by(.date)' /tmp/thisweek.json /tmp/nextweek.json > /tmp/high.json
          jq -n --slurpfile ev /tmp/high.json '{source: "Forex Factory", events: $ev[0]}' > news.json
          cat news.json | head -c 600
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update Forex Factory high-impact news"
          git pull --rebase -q || true
          git push
