# ดึงข่าว USD ระดับแดง (High) และส้ม (Medium) จาก Forex Factory ทุกชั่วโมง แล้วบันทึกเป็น news.json ให้หน้าแอปอ่าน
name: ff-news
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/news.yml']
permissions:
  contents: write
concurrency: ff-news
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Forex Factory calendar
        run: |
          set -e
          ok=0
          for wk in thisweek nextweek; do
            if curl -fsSL -A 'Mozilla/5.0 (oi-gold news bot)' "https://nfs.faireconomy.media/ff_calendar_${wk}.json" -o "/tmp/${wk}.json"; then ok=1; else echo '[]' > "/tmp/${wk}.json"; fi
          done
          [ "$ok" = 1 ] || { echo "fetch failed"; exit 0; }
          jq -s 'add | map(select(.country == "USD" and (.impact == "High" or .impact == "Medium")))
                 | map({date, c: .country, i: (if .impact == "High" then "H" else "M" end), title, forecast, previous})
                 | unique_by([.date, .c, .title]) | sort_by(.date)' /tmp/thisweek.json /tmp/nextweek.json > /tmp/high.json
          jq -n --slurpfile ev /tmp/high.json '{source: "Forex Factory", events: $ev[0]}' > news.json
          cat news.json | head -c 600
      - name: Fetch GC futures 5m history (Yahoo)
        run: |
          set +e
          for host in query1 query2; do
            curl -fsSL -A 'Mozilla/5.0' "https://${host}.finance.yahoo.com/v8/finance/chart/GC=F?interval=5m&range=5d" -o /tmp/gc.json && break
          done
          if jq -e '.chart.result[0].timestamp' /tmp/gc.json >/dev/null 2>&1; then
            jq -c '.chart.result[0] as $r | {symbol: $r.meta.symbol, updated: now|floor,
                   bars: [range($r.timestamp|length) as $i | [$r.timestamp[$i], $r.indicators.quote[0].close[$i]] | select(.[1] != null) | [.[0], ((.[1]*100|round)/100)]]}' /tmp/gc.json > gc.json
            echo "GC bars: $(jq '.bars|length' gc.json)"; jq -c '.bars[-3:]' gc.json
          else
            echo "Yahoo fetch failed"; head -c 300 /tmp/gc.json
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json gc.json 2>/dev/null || git add news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update news and GC history"
          git pull --rebase -q || true
          git push
