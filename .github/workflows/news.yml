# ดึงข่าว USD แดง/ส้มจาก Forex Factory + ผลข่าวจริงจาก FXStreet ทุก 5 นาที บันทึกเป็น news.json
# ราคา GC จาก Yahoo ดึงชั่วโมงละครั้ง (ข้ามถ้า gc.json ยังอายุไม่ถึง 55 นาที)
name: ff-news
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/news.yml', 'scripts/news.py', 'scripts/yf.py', 'scripts/gc1m.py']
permissions:
  contents: write
concurrency: ff-news
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news (Forex Factory) + actual results (FXStreet)
        run: python3 scripts/news.py
      - name: Fetch GC futures 5m history (Yahoo)
        run: |
          set +e
          age=$(( $(date +%s) - $(jq -r '.updated // 0' gc.json 2>/dev/null || echo 0) ))
          if [ "$age" -lt 3300 ]; then echo "gc.json fresh (${age}s), skip"; exit 0; fi
          for host in query1 query2; do
            curl -fsSL -A 'Mozilla/5.0' "https://${host}.finance.yahoo.com/v8/finance/chart/GC=F?interval=5m&range=5d" -o /tmp/gc.json && break
          done
          if jq -e '.chart.result[0].timestamp' /tmp/gc.json >/dev/null 2>&1; then
            jq -c '.chart.result[0] as $r | {symbol: $r.meta.symbol, updated: now|floor,
                   bars: [range($r.timestamp|length) as $i | [$r.timestamp[$i], $r.indicators.quote[0].close[$i]] | select(.[1] != null) | [.[0], ((.[1]*100|round)/100)]]}' /tmp/gc.json > gc.json
            echo "GC bars: $(jq '.bars|length' gc.json)"; jq -c '.bars[-3:]' gc.json
          else
            echo "Yahoo fetch failed"; head -c 300 /tmp/gc.json
          fi
      - name: Fetch YM=F (US30) bars (Yahoo)
        run: |
          age=$(( $(date +%s) - $(jq -r '.updated // 0' ym.json 2>/dev/null || echo 0) ))
          if [ "$age" -lt 240 ]; then echo "ym.json fresh (${age}s), skip"; exit 0; fi
          python3 scripts/yf.py YM=F ym.json
      - name: Fetch GC=F 1m bars (Yahoo) for live offset pairing
        run: |
          age=$(( $(date +%s) - $(jq -r '.updated // 0' gcm.json 2>/dev/null || echo 0) ))
          if [ "$age" -lt 150 ]; then echo "gcm.json fresh (${age}s), skip"; exit 0; fi
          python3 scripts/gc1m.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json gc.json ym.json gcm.json 2>/dev/null || git add news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update news and GC history"
          git pull --rebase -q || true
          git push
