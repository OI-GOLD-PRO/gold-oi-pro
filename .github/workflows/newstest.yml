name: news-source-test
on:
  push:
    paths: ['.github/workflows/newstest.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS -A 'Mozilla/5.0' -H 'Referer: https://www.fxstreet.com/' "https://calendar-api.fxstreet.com/en/api/v1/eventDates/2026-10-11T00:00:00Z/2026-10-24T00:00:00Z?countries=US&volatilities=HIGH&volatilities=MEDIUM" -o debug_fx.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached debug_news.txt; rm -f debug_news.txt
          git add -A; git commit -m "news source test 2"; git pull --rebase -q; git push
