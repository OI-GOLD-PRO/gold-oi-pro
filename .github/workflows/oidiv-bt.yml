# Backtest OI Divergence รายสัปดาห์ (COT + Yahoo) — กด Run workflow เองเมื่ออยากทดสอบซ้ำ ผลอยู่ใน log
name: oidiv-bt
on:
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/oidiv_bt.mjs
