# Backtest แหล่งแถบ SL ของ 💀 กับดัก (Yahoo GC=F M5 60 วัน) — กด Run workflow เอง ผลอยู่ใน log
name: trap-bt
on:
  workflow_dispatch:
  push:
    paths: ['scripts/trap_bt.mjs']
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/trap_bt.mjs
