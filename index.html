<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OI Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* Layout: แถบหัวราคา > ชิปข้อมูล OI > ปุ่มไทม์เฟรม > กราฟเต็มจอ (มี overlay วาดแท่ง OI ทับ) */
  :root {
    --bg: #0b1020;        /* พื้นหลังกราฟ น้ำเงินกรมเข้ม */
    --panel: #121a30;
    --line: #1f2a46;
    --fg: #e6e9f2;
    --muted: #8a93ab;
    --gold: #e0b44c;      /* สีแบรนด์ทอง ใช้กับราคา/ปุ่มที่เลือก */
    --put: #2fbf8f;       /* Put = แนวรับ */
    --call: #e5576b;      /* Call = แนวต้าน */
    --chg: #9aa3b8;       /* OI change สีเทา */
    --up: #26a69a;
    --down: #ef5350;
    --sans: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; height: 100dvh; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px 6px; }
  .sym { display: flex; flex-direction: column; min-width: 0; }
  .sym b { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .sym span { font-size: 11px; color: var(--muted); }
  .px { margin-left: auto; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .px #price { font-size: 22px; font-weight: 600; color: var(--gold); }
  .px #chg { font-size: 11px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--put); box-shadow: 0 0 6px var(--put); }
  button.icon { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; width: 38px; height: 38px; font-size: 18px; flex: none; }
  button.icon:active { transform: scale(.95); }
  .chips { display: flex; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 11px; padding: 4px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
  .chip.warn { border-color: #7a5a1c; color: var(--gold); }
  .tfs { display: flex; gap: 4px; padding: 0 14px 8px; }
  .tfs button { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 0; font: 600 12px var(--mono); }
  .tfs button.on { background: var(--gold); border-color: var(--gold); color: #1a1405; }
  #wrap { position: relative; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
  #chart, #ov { position: absolute; inset: 0; }
  #ov { pointer-events: none; z-index: 2; }
  #tip { position: absolute; left: 10px; top: 8px; z-index: 3; font-size: 12px; background: rgba(18,26,48,.92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-family: var(--mono); pointer-events: none; }
  #tip .p { color: var(--put); } #tip .c { color: var(--call); }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); font-size: 13px; z-index: 4; pointer-events: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  .legend i { display: inline-block; width: 10px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .legend .rt { margin-left: auto; font-family: var(--mono); }
  button.icon.on { border-color: var(--gold); color: var(--gold); }
  #toast { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 5; background: #2a2208; border: 1px solid var(--gold); color: var(--fg); border-radius: 10px; padding: 9px 12px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  #toast b { color: var(--gold); font-family: var(--mono); }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <div class="sym"><b>XAUUSD</b><span id="src">OI</span></div>
    <div class="px"><div id="price">–</div><div id="chg">กำลังโหลด</div></div>
    <button class="icon" id="bell" aria-label="เปิดหรือปิดแจ้งเตือนโซน OI">🔕</button>
    <button class="icon" id="reload" aria-label="โหลดข้อมูล OI จากชีตใหม่">⟳</button>
  </header>
  <div class="chips" id="chips"><span class="chip">กำลังอ่านชีต…</span></div>
  <div class="tfs" id="tfs">
    <button data-tf="1m">M1</button>
    <button data-tf="5m">M5</button>
    <button data-tf="15m">M15</button>
    <button data-tf="30m">M30</button>
    <button data-tf="1h">H1</button>
    <button data-tf="4h">H4</button>
  </div>
  <div id="wrap">
    <div id="chart"></div>
    <canvas id="ov"></canvas>
    <div id="tip" hidden></div>
    <div id="toast" hidden></div>
    <div id="msg">กำลังโหลดกราฟ…</div>
  </div>
  <div class="legend">
    <span><i style="background:var(--put)"></i>Put แนวรับ</span>
    <span><i style="background:var(--call)"></i>Call แนวต้าน</span>
    <span><i style="background:linear-gradient(90deg,var(--call) 50%,var(--put) 50%);opacity:.5"></i>OI เปลี่ยน</span>
    <span><i style="background:var(--gold);opacity:.6"></i>Vol วันนี้</span>
    <span class="rt" id="clock"></span>
  </div>

<script>
(function () {
  const SYMBOL = 'XAUUSDT';
  const TZ_SHIFT = 7 * 3600; // แสดงเวลาไทยบนแกนเวลา

  const $ = id => document.getElementById(id);
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();

  let tf = '5m';
  try { tf = localStorage.getItem('oi_tf') || '5m'; } catch (e) { /* ใช้ค่าเริ่มต้น */ }
  let ws = null, wsTimer = null, lastClose = null, dayOpen = null;
  // ปรับราคากราฟ perpetual ให้เท่าราคา GC (ทองฟิวเจอร์): ราคาที่แสดง = ราคา perp − adj
  // adj = (perp − spot) − carry  โดย carry = GC − spot จากชีต (วัดตอนอัพเดท) และรีเฟรชทุก 1 ชม.
  // ถ้าไม่มี carry ในชีต ใช้ adj = −offset (ราคา perp + offset)
  let adj = 0, basisEma = null, rawBars = [], rawClose = null, offRaw = null, carry = null, adjSet = false, adjAt = null;
  const REFRESH_MS = 60 * 60 * 1000;

  // ---------- กราฟ ----------
  const chartEl = $('chart');
  const chart = LightweightCharts.createChart(chartEl, {
    layout: { background: { color: C('--bg') }, textColor: C('--muted'), fontFamily: C('--mono'), fontSize: 11 },
    grid: { vertLines: { color: 'rgba(31,42,70,.55)' }, horzLines: { color: 'rgba(31,42,70,.55)' } },
    rightPriceScale: { borderColor: C('--line'), scaleMargins: { top: .08, bottom: .08 } },
    timeScale: { borderColor: C('--line'), timeVisible: true, secondsVisible: false, rightOffset: 8 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    autoSize: true,
  });
  const series = chart.addCandlestickSeries({
    upColor: C('--up'), downColor: C('--down'), borderVisible: false,
    wickUpColor: C('--up'), wickDownColor: C('--down'),
    priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
  });

  // ---------- ข้อมูล OI ----------
  let oi = null; // {rows:[{strike,p,c,price}], offset, maxOI}

  function buildOI(d) {
    const off = Number(d.cfg && d.cfg.offset);
    const map = new Map();
    (d.levels || []).forEach(l => {
      const r = map.get(l.strike) || { strike: l.strike, p: 0, c: 0, dp: null, dc: null };
      const chg = (l.chg === null || l.chg === undefined || !isFinite(l.chg)) ? null : Number(l.chg);
      if (l.type === 'P') { r.p += l.oi; if (chg !== null) r.dp = chg; }
      else { r.c += l.oi; if (chg !== null) r.dc = chg; }
      map.set(l.strike, r);
    });
    const rows = [...map.values()].sort((a, b) => a.strike - b.strike);
    const ok = isFinite(off);
    const cr = Number(d.cfg && d.cfg.carry);
    carry = (d.cfg && d.cfg.carry !== undefined && d.cfg.carry !== '' && isFinite(cr)) ? cr : null;
    rows.forEach(r => { r.price = ok ? r.strike : null; });
    const maxOI = Math.max(1, ...rows.map(r => Math.max(r.p, r.c)));
    const maxChg = Math.max(1, ...rows.map(r => Math.max(Math.abs(r.dp || 0), Math.abs(r.dc || 0))));
    const hasChg = rows.some(r => r.dp !== null || r.dc !== null);
    // volume ระหว่างวัน: แท็บ webapp key "volume" = {"strike":[call,put]}
    let vol = {};
    try { vol = d.cfg && d.cfg.volume ? JSON.parse(d.cfg.volume) : {}; } catch (e) { vol = {}; }
    rows.forEach(r => { const v = vol[String(r.strike)]; r.vc = v ? Number(v[0]) : null; r.vp = v ? Number(v[1]) : null; });
    const maxVol = Math.max(1, ...rows.map(r => Math.max(r.vc || 0, r.vp || 0)));
    const hasVol = rows.some(r => r.vc !== null || r.vp !== null);
    const topP = [...rows].sort((a, b) => b.p - a.p).slice(0, 3).map(r => r.strike);
    const topC = [...rows].sort((a, b) => b.c - a.c).slice(0, 3).map(r => r.strike);
    const topV = [...rows].filter(r => (r.vc || 0) + (r.vp || 0) > 0)
      .sort((a, b) => ((b.vc || 0) + (b.vp || 0)) - ((a.vc || 0) + (a.vp || 0))).slice(0, 5).map(r => r.strike);
    const top5P = [...rows].filter(r => r.p > 0).sort((a, b) => b.p - a.p).slice(0, 5).map(r => r.strike);
    const top5C = [...rows].filter(r => r.c > 0).sort((a, b) => b.c - a.c).slice(0, 5).map(r => r.strike);
    offRaw = ok ? off : null;
    oi = { top5P, top5C, rows, offset: ok ? off : null, maxOI, maxChg, hasChg, maxVol, hasVol, topP, topC, topV };

    const cfg = d.cfg || {};
    const chips = [];
    chips.push(`<span class="chip">สัญญา <b>${esc(cfg.contract || '–')}</b></span>`);
    chips.push(ok ? `<span class="chip" id="offchip"></span>` : `<span class="chip warn">ยังไม่มี offset ในแท็บ webapp</span>`);
    chips.push(`<span class="chip" id="rawchip"></span>`);
    $('chips').innerHTML = chips.join('');
    paintRaw();
    if (ok && (carry === null || !adjSet)) applyAdj(-off); else paintOff();
    if (ok) refreshAdj(true);
    dirty = true;
    if (typeof resetArming === 'function') resetArming(lastClose);
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

  // ข้อมูล OI ดึงจาก Apps Script (?api=data) ซึ่งอ่านชีตให้
  const API = 'https://script.google.com/macros/s/AKfycbwQrp29KWhUCVO0ojjS73SiLtDKe1QKx69KOOF90QQOlV3csHXqxfOGUYKYw2D6nZp0tw/exec?api=data';

  async function loadSheet() {
    $('chips').innerHTML = '<span class="chip">กำลังอ่านชีต…</span>';
    try {
      const r = await fetch(API + '&t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      buildOI(await r.json());
    } catch (e) {
      $('chips').innerHTML = `<span class="chip warn">อ่านชีตไม่ได้: ${esc(e.message || e)} กด ⟳ ลองใหม่</span>`;
    }
  }

  // ---------- overlay แท่ง OI ----------
  const ov = $('ov'), ctx = ov.getContext('2d');
  let dirty = true, lastKey = '';

  function drawOverlay() {
    const w = chartEl.clientWidth, h = chartEl.clientHeight, dpr = window.devicePixelRatio || 1;
    if (ov.width !== Math.round(w * dpr) || ov.height !== Math.round(h * dpr)) {
      ov.width = Math.round(w * dpr); ov.height = Math.round(h * dpr);
      ov.style.width = w + 'px'; ov.style.height = h + 'px';
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!oi || oi.offset === null || !oi.rows.length) return;

    const plotW = chart.timeScale().width();
    const plotH = h - chart.timeScale().height();
    const barMax = Math.min(plotW * 0.32, 150);
    const pts = oi.rows.map(r => ({ r, y: series.priceToCoordinate(r.price) })).filter(o => o.y !== null && o.y > 2 && o.y < plotH - 2);
    if (!pts.length) return;
    let gap = Infinity;
    for (let i = 1; i < pts.length; i++) gap = Math.min(gap, Math.abs(pts[i].y - pts[i - 1].y));
    const thick = Math.max(2, Math.min(6, gap / 2 - 1));
    const putC = C('--put'), callC = C('--call'), chgC = C('--chg');
    const chgMax = Math.min(plotW * 0.18, 80);
    const volMax = Math.min(plotW * 0.14, 60);
    const volC = C('--gold');
    ctx.font = `10px ${C('--mono')}`;
    const padL = Math.ceil(ctx.measureText('0000').width) + 8; // ที่ว่างซ้ายสำหรับเลข strike (ราคาฟิวเจอร์)

    ctx.font = `10px ${C('--mono')}`;
    ctx.textBaseline = 'middle';
    pts.forEach(({ r, y }) => {
      const big = oi.topP.includes(r.strike) && r.p > 0 || oi.topC.includes(r.strike) && r.c > 0;
      const strength = Math.max(r.p, r.c) / oi.maxOI;
      // เส้นระดับจาง ๆ ทุก strike
      const yy = Math.round(y) + .5, mid = plotW / 2;
      const hline = (x0, x1) => { ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke(); };
      // เส้นประเฉพาะ OI มากสุด 5 อันดับของแต่ละฝั่ง
      const in5C = oi.top5C.includes(r.strike), in5P = oi.top5P.includes(r.strike);
      if (in5C || in5P) {
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = (in5C && (!in5P || r.c >= r.p)) ? callC : putC;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]); hline(0, plotW); ctx.setLineDash([]);
      }
      // กำแพง OI ใหญ่ 3 อันดับ (Call แดง / Put เขียว): เส้นทึบจากขอบขวาถึงกลางกราฟ
      const isTopC = oi.topC.includes(r.strike) && r.c > 0, isTopP = oi.topP.includes(r.strike) && r.p > 0;
      if (isTopC || isTopP) {
        ctx.globalAlpha = 0.95; ctx.lineWidth = 2;
        ctx.strokeStyle = (isTopC && (!isTopP || r.c >= r.p)) ? callC : putC;
        hline(mid, plotW);
      }
      // Volume วันนี้ 5 อันดับ: เส้นทึบสีเหลืองจากขอบซ้ายถึงกลางกราฟ
      if (oi.topV && oi.topV.includes(r.strike)) {
        ctx.globalAlpha = 0.95; ctx.lineWidth = 2; ctx.strokeStyle = volC;
        hline(0, mid);
      }
      if (hit && hit.strike === r.strike && Date.now() < hit.until) {
        ctx.globalAlpha = 0.9; ctx.strokeStyle = C('--gold'); ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0, Math.round(y) + .5); ctx.lineTo(plotW, Math.round(y) + .5); ctx.stroke();
      }
      // แท่ง Call (บนเส้น) และ Put (ใต้เส้น) ยื่นจากขอบขวา
      ctx.globalAlpha = 0.9;
      if (r.c > 0) { const L = Math.max(2, barMax * r.c / oi.maxOI); ctx.fillStyle = callC; ctx.fillRect(plotW - L, y - thick, L, thick); }
      if (r.p > 0) { const L = Math.max(2, barMax * r.p / oi.maxOI); ctx.fillStyle = putC; ctx.fillRect(plotW - L, y, L, thick); }

      // OI change: แท่งเทาจากขอบซ้าย (Call บนเส้น / Put ใต้เส้น) ทึบ = เพิ่ม, กรอบโปร่ง = ลด
      let chgEnd = padL;
      if (oi.hasChg) {
        const chgBar = (v, top, col) => {
          if (v === null || v === 0) return;
          const L = Math.max(2, chgMax * Math.abs(v) / oi.maxChg);
          const yy = top ? y - thick : y;
          if (v > 0) { ctx.fillStyle = col; ctx.fillRect(padL, yy, L, thick); }
          else { ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(padL + 0.5, yy + 0.5, L - 1, Math.max(1, thick - 1)); }
          chgEnd = Math.max(chgEnd, padL + L);
        };
        ctx.globalAlpha = 0.9;
        ctx.globalAlpha = 0.45; chgBar(r.dc, true, callC);
        chgBar(r.dp, false, putC);
      }

      // Volume ระหว่างวัน: แท่งสีทอง คอลัมน์ถัดจาก OI change (Call บนเส้น / Put ใต้เส้น)
      let leftEnd = chgEnd;
      if (oi.hasVol) {
        const volX = padL + (oi.hasChg ? chgMax + 6 : 0);
        ctx.globalAlpha = 0.6; ctx.fillStyle = volC;
        if (r.vc) { const L = Math.max(2, volMax * r.vc / oi.maxVol); ctx.fillRect(volX, y - thick, L, thick); }
        if (r.vp) { const L = Math.max(2, volMax * r.vp / oi.maxVol); ctx.fillRect(volX, y, L, thick); }
        leftEnd = volX + volMax;
      }

      // ป้ายตัวเลข
      ctx.globalAlpha = 1;
      // เลข strike (ราคาฟิวเจอร์) ชิดซ้าย
      if (gap >= 13 || big || strength >= 0.35) {
        ctx.fillStyle = big ? C('--fg') : C('--muted');
        ctx.textAlign = 'left';
        ctx.fillText(String(r.strike), 4, y);
      }
      // OI ฝั่งขวา: แสดงเมื่อ Call หรือ Put ตั้งแต่ 30
      if (Math.max(r.c, r.p) >= 30) {
        ctx.fillStyle = big ? C('--fg') : C('--muted');
        const lab = `${r.c ? 'C' + r.c : ''}${r.c && r.p ? ' ' : ''}${r.p ? 'P' + r.p : ''}`;
        const L = barMax * Math.max(r.p, r.c) / oi.maxOI;
        ctx.textAlign = 'right';
        ctx.fillText(lab, plotW - L - 4, y);
      }
      // OI change + Volume: ใต้เลข strike ฝั่งซ้าย (ต้องมีที่ว่างระหว่างเส้นพอ)
      if (gap >= 24) {
        const sgn = v => (v > 0 ? '+' : '') + v;
        const dl = [r.dc ? 'C' + sgn(r.dc) : '', r.dp ? 'P' + sgn(r.dp) : ''].filter(Boolean).join(' ');
        const vl = (r.vc || r.vp) ? `V ${r.vc || 0}/${r.vp || 0}` : '';
        const txt = [dl ? 'Δ ' + dl : '', vl].filter(Boolean).join('  ');
        if (txt) {
          ctx.font = `9px ${C('--mono')}`;
          ctx.textAlign = 'left'; ctx.fillStyle = C('--muted');
          ctx.fillText(txt, 4, y + thick + 7);
          ctx.font = `10px ${C('--mono')}`;
        }
      }
    });
    ctx.globalAlpha = 1;
  }

  function loop() {
    const ref = oi && oi.rows.length && oi.offset !== null ? oi.rows[0].price : 0;
    const key = [chartEl.clientWidth, chartEl.clientHeight, chart.timeScale().width(), series.priceToCoordinate(ref), series.priceToCoordinate(ref + 50)].join('|');
    if (dirty || key !== lastKey) { drawOverlay(); lastKey = key; dirty = false; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // แตะกราฟเพื่อดู OI ของระดับที่ใกล้ที่สุด
  chart.subscribeCrosshairMove(param => {
    const tip = $('tip');
    if (!param.point || !oi || oi.offset === null) { tip.hidden = true; return; }
    const price = series.coordinateToPrice(param.point.y);
    if (price === null) { tip.hidden = true; return; }
    let best = null;
    oi.rows.forEach(r => { const d = Math.abs(r.price - price); if (!best || d < best.d) best = { r, d }; });
    if (!best || best.d > 3) { tip.hidden = true; return; }
    const r = best.r;
    const sg = v => v === null ? '–' : (v > 0 ? '+' : '') + v;
    tip.innerHTML = `strike <b>${r.strike}</b> → GC ${r.price.toFixed(2)}<br><span class="c">Call ${r.c}</span> (${sg(r.dc)}) · <span class="p">Put ${r.p}</span> (${sg(r.dp)})${(r.vc !== null || r.vp !== null) ? `<br>Vol วันนี้ C${r.vc || 0} / P${r.vp || 0}` : ''}`;
    tip.hidden = false;
  });

  // ---------- แจ้งเตือนเมื่อราคาเข้าใกล้โซน OI ----------
  const ALERT_MIN_OI = 50;   // เฉพาะ strike ที่ Put หรือ Call มี OI ตั้งแต่ 50
  const ALERT_TOL = 1.5;     // ห่างจากเส้นไม่เกิน $1.5 ถือว่าเข้าโซน
  const REARM = ALERT_TOL * 3; // ต้องออกห่าง $4.5 ก่อนจึงเตือนโซนเดิมซ้ำ
  let alertsOn = false;
  try { alertsOn = localStorage.getItem('oi_alert') === '1'; } catch (e) {}
  let actx = null, wakeLock = null, hit = null;
  const armed = new Map();

  const alertZones = () => (oi && oi.offset !== null) ? oi.rows.filter(r => Math.max(r.p, r.c) >= ALERT_MIN_OI) : [];

  function resetArming(price) {
    armed.clear();
    alertZones().forEach(r => armed.set(r.strike, price === null || Math.abs(price - r.price) > ALERT_TOL));
  }

  function beep() {
    if (!actx) return;
    const t = actx.currentTime;
    [0, 0.22, 0.44].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.18);
      o.start(t + d); o.stop(t + d + 0.2);
    });
  }

  function showToast(html) {
    const el = $('toast'); el.innerHTML = html; el.hidden = false;
    clearTimeout(showToast.t); showToast.t = setTimeout(() => { el.hidden = true; }, 15000);
  }

  function fire(r, price) {
    hit = { strike: r.strike, until: Date.now() + 60000 }; dirty = true;
    beep();
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    const side = r.c >= r.p ? 'แนวต้าน' : 'แนวรับ';
    showToast(`🔔 ราคา <b>${price.toFixed(2)}</b> เข้าโซน ${side} strike <b>${r.strike}</b> (GC ${r.price.toFixed(2)}) · Call ${r.c} · Put ${r.p}`);
  }

  function checkAlerts(price) {
    if (!alertsOn || price === null) return;
    alertZones().forEach(r => {
      const d = Math.abs(price - r.price);
      if (d <= ALERT_TOL) {
        if (armed.get(r.strike) !== false) { armed.set(r.strike, false); fire(r, price); }
      } else if (d >= REARM) {
        armed.set(r.strike, true);
      }
    });
  }

  async function keepAwake() {
    try { if (alertsOn && 'wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  function paintBell() {
    const b = $('bell'); b.textContent = alertsOn ? '🔔' : '🔕'; b.classList.toggle('on', alertsOn);
  }

  $('bell').addEventListener('click', () => {
    alertsOn = !alertsOn;
    try { localStorage.setItem('oi_alert', alertsOn ? '1' : '0'); } catch (e) {}
    if (alertsOn) {
      try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
      resetArming(lastClose);
      beep();
      keepAwake();
      showToast(`🔔 เปิดแจ้งเตือนแล้ว: ${alertZones().length} โซน (OI ≥ ${ALERT_MIN_OI}) ห่างเส้นไม่เกิน $${ALERT_TOL} · เปิดแอปค้างไว้เพื่อให้เตือนได้`);
    } else {
      try { wakeLock && wakeLock.release(); } catch (e) {}
      wakeLock = null;
      showToast('🔕 ปิดแจ้งเตือนแล้ว');
    }
    paintBell();
  });
  paintBell();
  // เปิดแอปมาโดยที่เปิดแจ้งเตือนค้างไว้: บราวเซอร์ให้เล่นเสียงได้หลังแตะจอครั้งแรกเท่านั้น
  document.addEventListener('pointerdown', () => {
    if (!alertsOn) return;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    if (!wakeLock) keepAwake();
  }, { passive: true });

  // ---------- ราคา: ลองหลายแหล่ง (บางเครือข่ายในไทยเข้า Bybit ไม่ได้) ----------
  const tfSec = { '1m': 60, '5m': 300, '15m': 900, '30m': 1800, '1h': 3600, '4h': 14400 };
  const BYBIT_TF = { '1m': '1', '5m': '5', '15m': '15', '30m': '30', '1h': '60', '4h': '240', '1d': 'D' };
  const BITGET_TF = { '1m': '1m', '5m': '5m', '15m': '15m', '30m': '30m', '1h': '1H', '4h': '4H', '1d': '1D' };
  const PROVIDERS = [
    {
      id: 'bybit', name: 'Bybit',
      rest: (t, n) => `https://api.bybit.com/v5/market/kline?category=linear&symbol=${SYMBOL}&interval=${BYBIT_TF[t]}&limit=${n}`,
      parse: j => { if (j.retCode !== 0) throw new Error(j.retMsg); return j.result.list.map(k => [+k[0], +k[1], +k[2], +k[3], +k[4]]); },
      ws: () => 'wss://stream.bybit.com/v5/public/linear',
      sub: t => ({ op: 'subscribe', args: [`kline.${BYBIT_TF[t]}.${SYMBOL}`] }),
      ping: '{"op":"ping"}', pingMs: 20000,
      msg: (m, t) => (m.topic === `kline.${BYBIT_TF[t]}.${SYMBOL}` && m.data) ? m.data.map(k => [+k.start, +k.open, +k.high, +k.low, +k.close]) : null,
    },
    {
      id: 'bitget', name: 'Bitget',
      rest: (t, n) => `https://api.bitget.com/api/v2/mix/market/candles?symbol=${SYMBOL}&productType=usdt-futures&granularity=${BITGET_TF[t]}&limit=${n}`,
      parse: j => { if (j.code !== '00000') throw new Error(j.msg); return j.data.map(k => [+k[0], +k[1], +k[2], +k[3], +k[4]]); },
      ws: () => 'wss://ws.bitget.com/v2/ws/public',
      sub: t => ({ op: 'subscribe', args: [{ instType: 'USDT-FUTURES', channel: 'candle' + BITGET_TF[t], instId: SYMBOL }] }),
      ping: 'ping', pingMs: 25000,
      msg: (m, t) => (m.arg && m.arg.channel === 'candle' + BITGET_TF[t] && m.data) ? m.data.map(k => [+k[0], +k[1], +k[2], +k[3], +k[4]]) : null,
    },
    {
      id: 'binance', name: 'Binance',
      rest: (t, n) => `https://fapi.binance.com/fapi/v1/klines?symbol=${SYMBOL}&interval=${t}&limit=${n}`,
      parse: j => { if (!Array.isArray(j)) throw new Error(j.msg || 'bad data'); return j.map(k => [+k[0], +k[1], +k[2], +k[3], +k[4]]); },
      ws: t => `wss://fstream.binance.com/ws/${SYMBOL.toLowerCase()}@kline_${t}`,
      sub: null, ping: null, pingMs: 0,
      msg: (m, t) => (m.k && m.k.i === t) ? [[+m.k.t, +m.k.o, +m.k.h, +m.k.l, +m.k.c]] : null,
    },
  ];
  let prov = null, pingTimer = null, lastBarTime = null;
  try { const id = localStorage.getItem('oi_src'); const i = PROVIDERS.findIndex(p => p.id === id); if (i > 0) PROVIDERS.unshift(PROVIDERS.splice(i, 1)[0]); } catch (e) {}

  const toBar = k => ({ time: Math.floor(k[0] / 1000) + TZ_SHIFT, open: k[1] - adj, high: k[2] - adj, low: k[3] - adj, close: k[4] - adj });

  // ราคาทอง spot จาก gold-api.com ใช้วัดส่วนต่าง perp − spot แล้วเลื่อนกราฟลงให้ตรงกับราคา forex
  function paintOff() {
    const el = $('offchip'); if (!el) return;
    const t = adjAt ? adjAt.toLocaleTimeString('th-TH', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' }) : '';
    el.innerHTML = `offset <b>${(-adj).toFixed(2)}</b>${t ? ' · ' + t : ''}`;
  }
  function applyAdj(next) {
    adj = Math.round(next * 100) / 100; adjSet = true; adjAt = new Date();
    if (rawBars.length) { try { series.setData(rawBars.map(toBar)); } catch (e) {} }
    if (rawClose !== null) lastClose = rawClose - adj;
    dirty = true; showPrice(); paintOff();
    if (typeof resetArming === 'function' && lastClose !== null) resetArming(lastClose);
  }
  // คำนวณ offset ใหม่: GC ประมาณ = spot ล่าสุด + carry → offset = GC − perp
  function refreshAdj(force) {
    if (carry === null || basisEma === null) return;
    if (!force && adjAt && Date.now() - adjAt.getTime() < REFRESH_MS - 5000) return;
    applyAdj(basisEma - carry);
  }
  async function updateBasis() {
    if (rawClose === null) return;
    try {
      const r = await fetch('https://api.gold-api.com/price/XAU', { cache: 'no-store' });
      const spot = Number((await r.json()).price);
      const basis = rawClose - spot;
      if (!isFinite(basis) || Math.abs(basis) > 25) return;
      const first = basisEma === null;
      basisEma = first ? basis : basisEma * 0.7 + basis * 0.3;
      if (first) refreshAdj(true);
    } catch (e) {}
  }
  setInterval(updateBasis, 30000);
  // ทุก 1 ชั่วโมง: อ่านชีตใหม่ (OI/carry ล่าสุด) แล้วคำนวณ offset ใหม่
  setInterval(() => { loadSheet().then(() => refreshAdj(false)); }, REFRESH_MS);

  async function fetchBars(p, t, n) {
    const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 7000);
    try {
      const r = await fetch(p.rest(t, n), { cache: 'no-store', signal: ac.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const rows = p.parse(await r.json()).sort((a, b) => a[0] - b[0]);
      if (!rows.length) throw new Error('no data');
      return rows;
    } finally { clearTimeout(timer); }
  }

  async function loadDayOpen() {
    if (!prov) return;
    try { const rows = await fetchBars(prov, '1d', 2); dayOpen = rows[rows.length - 1][1]; } catch (e) { dayOpen = null; }
  }

  function setSource(p) {
    const changed = prov !== p;
    prov = p;
    try { localStorage.setItem('oi_src', p.id); } catch (e) {}
    $('src').textContent = `OI · Powered by “${p.name}”`;
    if (changed) loadDayOpen().then(showPrice);
  }

  async function loadTF(next) {
    tf = next;
    try { localStorage.setItem('oi_tf', tf); } catch (e) {}
    document.querySelectorAll('#tfs button').forEach(b => b.classList.toggle('on', b.dataset.tf === tf));
    $('msg').hidden = false; $('msg').textContent = 'กำลังโหลดกราฟ…';
    const order = prov ? [prov, ...PROVIDERS.filter(p => p !== prov)] : PROVIDERS;
    const errs = [];
    for (const p of order) {
      try {
        const rows = await fetchBars(p, tf, 600);
        rawBars = rows;
        const bars = rows.map(toBar);
        series.setData(bars);
        rawClose = rows[rows.length - 1][4];
        lastClose = rawClose - adj;
        lastBarTime = bars[bars.length - 1].time;
        updateBasis();
        setSource(p);
        showPrice();
        chart.timeScale().scrollToRealTime();
        $('msg').hidden = true;
        dirty = true;
        openWS();
        return;
      } catch (e) { errs.push(`${p.name}: ${e.name === 'AbortError' ? 'timeout' : e.message}`); }
    }
    $('msg').textContent = 'ดึงราคาไม่ได้จากทุกแหล่ง (' + errs.join(' / ') + ') ลองกดเปลี่ยนไทม์เฟรมอีกครั้ง';
  }

  function openWS() {
    clearTimeout(wsTimer); clearInterval(pingTimer);
    if (ws) { ws.onclose = null; ws.close(); }
    if (!prov) return;
    const p = prov, t = tf;
    ws = new WebSocket(p.ws(t));
    ws.onopen = () => {
      if (p.sub) ws.send(JSON.stringify(p.sub(t)));
      if (p.ping) pingTimer = setInterval(() => { try { ws.send(p.ping); } catch (e) {} }, p.pingMs);
      $('dot').classList.add('live');
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      const rows = p.msg(m, t);
      if (!rows) return;
      // อัปเดตเฉพาะแท่งล่าสุดหรือใหม่กว่า (snapshot ของบางแหล่งส่งแท่งเก่ามาด้วย)
      rows.sort((a, b) => a[0] - b[0]).forEach(k => {
        const b = toBar(k);
        if (lastBarTime !== null && b.time < lastBarTime) return;
        try {
          series.update(b); lastBarTime = b.time; rawClose = k[4]; lastClose = rawClose - adj;
          const lastRaw = rawBars[rawBars.length - 1];
          if (lastRaw && lastRaw[0] === k[0]) rawBars[rawBars.length - 1] = k; else rawBars.push(k);
        } catch (e) {}
      });
      showPrice();
      checkAlerts(lastClose);
    };
    ws.onclose = () => { clearInterval(pingTimer); $('dot').classList.remove('live'); wsTimer = setTimeout(openWS, 3000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // ราคา XAUUSD จริงจากแหล่งที่ดึงกราฟ (ก่อนบวก offset)
  function paintRaw() {
    const el = $('rawchip'); if (!el) return;
    el.innerHTML = `XAUUSD${prov ? ' ' + esc(prov.name) : ''} <b>${rawClose !== null ? rawClose.toFixed(2) : '–'}</b>`;
  }
  function showPrice() {
    paintRaw();
    if (lastClose === null) return;
    $('price').textContent = lastClose.toFixed(2);
    if (dayOpen) {
      const d = lastClose - (dayOpen - adj), pct = d / (dayOpen - adj) * 100;
      $('chg').textContent = `${d >= 0 ? '+' : ''}${d.toFixed(2)} (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%) วันนี้`;
      $('chg').style.color = d >= 0 ? C('--up') : C('--down');
    } else { $('chg').textContent = ''; }
  }

  // กลับมาเปิดแอปจากหน้าจอโฮม: ต่อ websocket ใหม่และเติมแท่งที่ขาด
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { loadTF(tf); keepAwake(); try { actx && actx.resume(); } catch (e) {} }
  });

  setInterval(() => {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('th-TH', { hour12: false, timeZone: 'Asia/Bangkok' }) + ' น.';
  }, 1000);

  $('tfs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) loadTF(b.dataset.tf); });
  $('reload').addEventListener('click', loadSheet);

  if (!tfSec[tf]) tf = '5m';
  loadSheet();
  loadTF(tf);
})();
</script>
</body>
</html>
