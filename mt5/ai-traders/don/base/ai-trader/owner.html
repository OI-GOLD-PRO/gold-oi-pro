<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>OI AI Trader</title><link rel="stylesheet" href="/style.css"><style>body{margin:0}.mobile{max-width:800px;margin:auto}.mobile header{position:sticky;top:0;z-index:2;background:#0a101c;display:flex;flex-direction:row;align-items:center;padding:8px 12px;margin:0}.mobile h1{font-size:19px}.chart{display:block;width:100%;height:72vh;height:72svh;border:0}.mobile .panel{margin:8px}.sheet{box-sizing:border-box;color:inherit;background:#101c2b;border:1px solid #37465b;border-radius:16px;width:min(96vw,440px);max-height:90dvh;overflow:auto}.sheet::backdrop{background:#000a}.sheet h2{margin:4px 0 16px}.sheet input{font-size:16px}.mobile a{color:#e5c778}</style><main class="mobile"><header><h1>OI AI Trader</h1><button id="openSettings" type="button" aria-label="ตั้งค่า AI Demo">⚙ ตั้งค่า AI</button></header><section class="panel"><h2 id="chartTitle">กราฟ M5 · รอข้อมูลจาก EA</h2><canvas hidden id="priceChart" style="width:100%;height:35svh" aria-label="กราฟแท่งเทียน M5 ของบัญชี Demo"></canvas></section><section class="panel"><h2>สถานะ EA</h2><p id="state"></p><p id="risk"></p><p id="oi"></p></section><section class="panel"><h2>การตัดสินใจล่าสุด</h2><div id="feed"></div></section><section class="panel"><h2>ประวัติดีลรายวัน</h2><label>วันที่ตามเวลาโบรกเกอร์<input id="day" type="date"></label><p id="total"></p><div id="deals"></div></section><dialog class="sheet" id="settings"><h2>ตั้งค่า AI Demo</h2><form id="riskForm">
<label>ความเสี่ยงต่อไม้ (%)<input name="perTrade" type="number" min="0.01" max="5" step=".01" required value=".5"></label>
<label>ความเสี่ยงรวม (%)<input name="total" type="number" min=".01" max="20" step=".01" required value="2"></label>
<label>ขาดทุนรายวัน (%)<input name="daily" type="number" min=".01" max="20" step=".01" required value="2"></label>
<label>จำนวนไม้สูงสุด<input name="positions" type="number" min="1" max="50" step="1" required value="5"></label>
<label class="check"><input name="hedging" type="checkbox"> อนุญาต Buy และ Sell พร้อมกัน</label>
<label class="check"><input name="enabled" type="checkbox"> เปิดให้ AI เทรดบัญชี Demo</label><button type="submit">บันทึกความเสี่ยง</button><p id="riskMessage" role="status"></p></form><button type="button" id="closeSettings">ปิด</button></dialog></main><script src="/viewer.js"></script><script src="/phone-settings.js"></script></html>
