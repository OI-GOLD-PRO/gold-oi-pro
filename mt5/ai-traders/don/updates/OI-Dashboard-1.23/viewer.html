<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>OI AI Trader</title><link rel="stylesheet" href="/style.css"><style>
body{background:#09121c;color:#e4edf6;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto}h1 small{font:12px monospace;color:#d7bc80}
#lamp{margin:8px 12px;padding:12px 16px;background:#142335;border-radius:12px;font-weight:650}#lamp:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#8895a3;margin-right:9px}#lamp.online:before{background:#36db97;box-shadow:0 0 8px #36db97}
#tabs{display:flex;gap:7px;margin:12px}#tabs button{flex:1;border:1px solid #304254;background:#132030;color:#d4e3ef;border-radius:8px}#tabs button[aria-pressed=true]{color:#181d21;background:#e4c381}
#calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}#calendar span{text-align:center;color:#a3b5c5}#calendar button{padding:4px 1px;min-width:0;min-height:50px;background:#182737;color:#eff6ff;border:1px solid #2b4054;border-radius:7px;font-size:14px}#calendar small{display:block;font:10px monospace;overflow-wrap:anywhere}#calendar button:disabled{opacity:.35}#calendar [aria-current=date]{outline:2px solid #dbc084}#calendar .gain{color:#6be8b2}#calendar .loss{color:#ff8990}
[hidden]{display:none!important}input[type=date]{max-width:100%;box-sizing:border-box}
</style><main class="shell"><header><h1>OI AI Trader <small>1.23</small></h1><span class="pill">MT5 · ดูอย่างเดียว</span></header><div id="lamp" role="status">กำลังตรวจสถานะ EA</div><nav id="tabs"><button aria-pressed="true">ภาพรวม</button><button aria-pressed="false">ประวัติ</button></nav><section class="panel"><h2>สถานะ EA</h2><p id="state"></p><p id="risk"></p><p id="oi"></p></section><section class="panel"><h2>การตัดสินใจล่าสุด</h2><div id="feed"></div></section><section class="panel"><h2>ปฏิทินกำไร–ขาดทุน</h2><p id="month"></p><div id="calendar"></div><label>วันที่ตามเวลาโบรกเกอร์<input id="day" type="date"></label><p id="total"></p><div id="deals"></div></section></main><script src="/viewer.js"></script></html>
